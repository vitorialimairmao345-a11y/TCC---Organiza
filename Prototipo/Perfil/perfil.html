<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="perfil.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

     
    <title>Perfil</title>
</head>
<body>
    <!------------------------------------------------------------>
    <!--Inicio Perfil-->
    <header>
        <div><img src="user.png" alt="Icon de perfil"></div>
        <div class="informacao">
            <h2 class="fw-bolder">Olá, Usuario</h2><BR>
            <h4>Tipo de Atividade: Serviço</h4>
            <h4>São Vicente - SP</h4>

        </div>

    </header>
    <!--Fim Perfil-->
    <!------------------------------------------------------------>


    <!-- Inicio Conteudo principal-->
    <main>     
        <!------------------------------------------------------------>
        <!-- Inicio Contas-->
        <article class="conta"> 
            <div class="d-flex align-items-center">
                <img src="wallet.png">
                <h3>Contas</h3>
            </div>
            <div class="bancos">
                <button class="PF">Pessoa Física</button>
                <button class="PJ">Pessoa Jurídica</button>
            </div>
        </article> 
         <!-- Fim Contas-->

        <!------------------------------------------------------------>


        <!-- Inicio Termometro MEI-->
        <article class="termometro"> 
            <h4>Termometro TETO MEI</h4><br>
            <h5>Faturamento Anual: R$10.000,00</h5><br>
            <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar" style="width: 25%">25%</div>
</div>
        </article> 
        <!-- fim Termometro MEI-->

         <!------------------------------------------------------------>

        <!--Inico ALerta pendencias-->
        <article class="alerts"> 
            <h4>Alerta de pendencias</h4><br>
        <div class="d-flex flex-column mb-3">
            <div class="p-2"><button class="aviso">⚠ DAS ATRASADO - 20/10/2026 ></button></div><br>
        </div>
        </article> 
        <!--FIm Alerta Pendencias-->

        <!------------------------------------------------------------>


        <!--Inico resumo do mes-->
        <!--Parte destinada ao historico do banco de dados-->
        <article class="resumo">

            <div class="d-inline-flex p-2"><!--Bootstrap flex inline-->

                <div class="d-flex"> <!--Bootstrap Flex fill-->
  <div class="p-2 flex-fill"><img src="calendario2.png" alt="Imagem de Calendario"></div><br>
  <div class="p-2 flex-fill"><h4 class="Res_mes">Resumo do mês</h4></div>
</div>
            </div>

            <!--Bootstrap Column pra colocar os dados do historico-->
            <!--codigo temporario dado pelo gemini-->
        </article>
        <!--Fim resumo do mes-->
        <!------------------------------------------------------------>

    </main> 
    <!-- Fim Conteudo principal-->

    <!--Navegação-->
    <footer class="navegacao">
       <!-- Navbar Inferior Flutuante -->
<nav class="custom-bottom-nav fixed-bottom">
  <div class="nav-container">
    <!-- Itens da Esquerda -->
    <a href="#" class="nav-item">
      <i class="bi bi-person"></i>
      <span>Perfil</span>
    </a>
    <a href="../Vendas/vendas.html" class="nav-item">
      <i class="bi bi-cash-coin"></i>
      <span>Vendas</span>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-file-text"></i>
      <span>Registro</span>
    </a>

    <!-- Botão Central de Destaque (+) -->
    <div class="nav-center-btn-wrapper">
      <button class="nav-center-btn" aria-label="Adicionar">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    <!-- Itens da Direita -->
    <a href="#" class="nav-item">
      <i class="bi bi-box-seam"></i>
      <span>Catalogo</span>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-graph-up"></i>
      <span>Estatistica</span>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-question-circle"></i>
      <span>FAQ</span>
    </a>
  </div>
</nav>
    </footer>
